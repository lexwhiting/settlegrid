[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "settlegrid"
version = "0.2.0"
description = "Python SDK for SettleGrid — pay-per-call billing for AI tools. Mirrors @settlegrid/mcp (TypeScript) surface for Pydantic AI / DSPy / LangChain Python / LlamaIndex / CrewAI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Alerterra, LLC", email = "support@settlegrid.ai" },
]
keywords = [
  "settlegrid",
  "ai-agent-payments",
  "pay-per-call",
  "stripe",
  "pydantic",
  "langchain",
  "llamaindex",
  "crewai",
  "dspy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0,<3.0",
  "httpx>=0.25,<1.0",
  "cachetools>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-mock>=3.12",
  "respx>=0.20",
  "ruff>=0.4",
  "mypy>=1.8",
  "build>=1.0",
  "twine>=4.0",
]

[project.urls]
Homepage = "https://settlegrid.ai"
Documentation = "https://settlegrid.ai/docs/python-sdk"
Repository = "https://github.com/lexwhiting/settlegrid"
Issues = "https://github.com/lexwhiting/settlegrid/issues"

[tool.hatch.build.targets.wheel]
packages = ["settlegrid"]

[tool.hatch.build.targets.sdist]
include = [
  "settlegrid/**/*.py",
  "settlegrid/py.typed",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:httpx.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "PT", "SIM"]
ignore = [
  "ANN101", # missing type annotation for self
  "ANN102", # missing type annotation for cls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PT011"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
