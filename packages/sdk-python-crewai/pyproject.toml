[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "settlegrid-crewai"
version = "0.1.0"
description = "CrewAI adapter for SettleGrid — wrap CrewAI tools with pay-per-call metering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Alerterra, LLC", email = "support@settlegrid.ai" },
]
keywords = ["settlegrid", "crewai", "ai-agent-payments", "pay-per-call"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "settlegrid>=0.1.0",
  "crewai-tools>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "respx>=0.20",
  "ruff>=0.4",
  "mypy>=1.8",
  "build>=1.0",
  "twine>=4.0",
]

[project.urls]
Homepage = "https://settlegrid.ai"
Repository = "https://github.com/lexwhiting/settlegrid"
Issues = "https://github.com/lexwhiting/settlegrid/issues"

[tool.hatch.build.targets.wheel]
packages = ["settlegrid_crewai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:httpx.*",
  "ignore::DeprecationWarning:crewai.*",
  "ignore::DeprecationWarning:pydantic.*",
  "ignore::PendingDeprecationWarning",
  "ignore::UserWarning",
  # CrewAI has a transitive import issue between crewai.rag and its
  # `embeddings` submodule that triggers ImportWarning on first import.
  # Not actionable from our side; ignore so test collection succeeds.
  "ignore::ImportWarning",
]

[tool.coverage.run]
source = ["settlegrid_crewai"]
branch = false

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "PT", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PT011"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
