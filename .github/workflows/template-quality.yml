name: Template Quality Gate

on:
  pull_request:
    paths:
      - 'open-source-servers/**'
      - 'packages/create-settlegrid-tool/templates/**'
      - 'scripts/build-registry.ts'
      - 'packages/mcp/src/template-schema.ts'

concurrency:
  group: template-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-manifests:
    name: templates / validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build MCP package
        run: npm --workspace @settlegrid/mcp run build

      - name: Validate all manifests (strict)
        run: npm run build:registry -- --strict

  run-quality-gates:
    name: templates / quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build MCP package
        run: npm --workspace @settlegrid/mcp run build

      - name: Run quality gates on changed templates
        run: npx tsx scripts/quality-gates.ts --only-changed

  schema-roundtrip:
    name: templates / schema roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build MCP package (regenerates JSON Schema)
        run: npm --workspace @settlegrid/mcp run build

      - name: Verify JSON Schema is up to date
        run: |
          # Use `git status --porcelain` instead of `git diff --exit-code` so
          # an untracked file (e.g., schema previously `git rm`'d, then
          # regenerated by build) is also caught — `git diff` only sees
          # tracked-file changes.
          STATUS=$(git status --porcelain packages/mcp/schemas/template.schema.json)
          if [[ -n "$STATUS" ]]; then
            echo "ERROR: packages/mcp/schemas/template.schema.json is out of date or untracked."
            echo "$STATUS"
            git diff packages/mcp/schemas/template.schema.json || true
            echo "Run 'npm --workspace @settlegrid/mcp run build' and commit the updated file."
            exit 1
          fi
