name: Template of the Week

# P5.4 — Weekly content cadence pipeline.
#
# Every Monday at 09:00 UTC the script picks the highest-scoring
# template from the registry based on PostHog signal (scaffold_success
# + template_detail_viewed over 7d), generates a 300-500 word draft
# with Claude, and opens a PR for the founder to rewrite + publish.
#
# Pre-launch (no PostHog traffic, every score = 0): the script writes
# `{"status":"no_candidate"}` to /tmp/totw-output.json and the
# workflow short-circuits. No Anthropic call has been made (the
# script bails before the API call), no PR opens, no Anthropic spend.
#
# Manual run: trigger via the Actions UI (`workflow_dispatch`). Pass
# `dry_run=true` to skip file writes — useful for testing the
# selection logic without burning a slot in totw-history.json.

on:
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip file writes (selection only)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-of-the-week
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so freshness-bonus git log works

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "settlegrid-bot"
          git config user.email "bot@settlegrid.ai"

      - name: Pick + draft
        id: pick
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          DRY_RUN_FLAG=""
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          npx tsx scripts/template-of-the-week.ts $DRY_RUN_FLAG --output /tmp/totw-output.json

      - name: Read output
        id: out
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/totw-output.json ]]; then
            echo "Script did not produce /tmp/totw-output.json"
            exit 1
          fi
          STATUS=$(jq -r '.status' /tmp/totw-output.json)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$STATUS" == "drafted" ]]; then
            echo "slug=$(jq -r '.slug' /tmp/totw-output.json)" >> "$GITHUB_OUTPUT"
            echo "date=$(jq -r '.date' /tmp/totw-output.json)" >> "$GITHUB_OUTPUT"
            echo "post_slug=$(jq -r '.postSlug' /tmp/totw-output.json)" >> "$GITHUB_OUTPUT"
            echo "template_name=$(jq -r '.templateName' /tmp/totw-output.json)" >> "$GITHUB_OUTPUT"
            echo "draft_file=$(jq -r '.draftFile' /tmp/totw-output.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — no candidate
        if: steps.out.outputs.status == 'no_candidate'
        run: |
          echo "::notice title=TOTW skipped::No candidate this week."
          jq -r '"Reason: \(.reason)\nScored: \(.scoredCount) templates\nRecently featured (blocked): \(.recentlyFeaturedCount)"' /tmp/totw-output.json

      - name: Branch + commit
        if: steps.out.outputs.status == 'drafted' && github.event.inputs.dry_run != 'true'
        env:
          SLUG: ${{ steps.out.outputs.slug }}
          DATE: ${{ steps.out.outputs.date }}
        run: |
          set -euo pipefail
          BRANCH="totw/${DATE}-${SLUG}"
          git checkout -b "$BRANCH"
          git add docs/content/totw-history.json \
                  apps/web/src/lib/blog-bodies/totw/registered.ts \
                  apps/web/src/lib/blog-bodies/totw/${DATE}-${SLUG}.md
          git commit -m "content(totw): ${DATE} ${SLUG} draft

          Generated by .github/workflows/template-of-the-week.yml.
          Founder rewrite expected: voice rules in docs/content/totw-playbook.md.
          Flip published:false → published:true in registered.ts to ship."
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.out.outputs.status == 'drafted' && github.event.inputs.dry_run != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.out.outputs.slug }}
          DATE: ${{ steps.out.outputs.date }}
          TEMPLATE_NAME: ${{ steps.out.outputs.template_name }}
        run: |
          set -euo pipefail
          SCORE=$(jq -r '.score' /tmp/totw-output.json)
          SCAFFOLD=$(jq -r '.scoreComponents.scaffold' /tmp/totw-output.json)
          VIEW=$(jq -r '.scoreComponents.view' /tmp/totw-output.json)
          FRESHNESS=$(jq -r '.scoreComponents.freshness' /tmp/totw-output.json)
          WC=$(jq -r '.wordCount' /tmp/totw-output.json)

          PR_BODY=$(cat <<PR_EOF
          ## Template of the Week — ${DATE}: ${TEMPLATE_NAME}

          Auto-generated draft. **Founder rewrite expected** before publish — see
          [docs/content/totw-playbook.md](docs/content/totw-playbook.md) for voice
          rules + cadence. Draft preview is in the first comment below.

          ### Selection signal (last 7 days)

          | metric | value |
          |---|---|
          | template slug | \`${SLUG}\` |
          | total score | ${SCORE} |
          | scaffold component (×2) | ${SCAFFOLD} |
          | view component | ${VIEW} |
          | freshness bonus | ${FRESHNESS} |
          | draft word count | ${WC} |

          ### Rewrite checklist

          - [ ] Voice: first-person, concrete, no marketing speak
          - [ ] Code snippet runs (paste it into a fresh shell, confirm)
          - [ ] CTA links to the right template page
          - [ ] Title matches the angle, not the template name
          - [ ] Flip \`published: false\` → \`published: true\` in registered.ts
          PR_EOF
          )

          PR_URL=$(gh pr create \
            --title "Template of the Week: ${DATE} — ${TEMPLATE_NAME}" \
            --body "$PR_BODY" \
            --label "totw" \
            --label "draft" \
            --base main \
            --head "totw/${DATE}-${SLUG}")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Post draft preview as PR comment
        if: steps.out.outputs.status == 'drafted' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          DRAFT_FILE: ${{ steps.out.outputs.draft_file }}
        run: |
          set -euo pipefail
          # Spec §P5.4: "Adds a PR comment with the draft preview".
          # The comment is the literal markdown body — no triple-fence
          # wrapper — so reviewers see how the post will actually
          # render. The PR body above carries the metadata + checklist;
          # this comment carries the prose.
          gh pr comment "$PR_URL" --body-file "$DRAFT_FILE"
