name: Python SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/sdk-python/**'
      - '.github/workflows/python-sdk-ci.yml'
  pull_request:
    paths:
      - 'packages/sdk-python/**'
      - '.github/workflows/python-sdk-ci.yml'

defaults:
  run:
    working-directory: packages/sdk-python

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: packages/sdk-python/pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check settlegrid tests

      - name: Type check (mypy)
        run: mypy settlegrid

      - name: Tests + coverage
        run: pytest --cov=settlegrid --cov-report=xml --cov-report=term --cov-fail-under=90

  build:
    name: build wheel + sdist + smoke install
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Smoke install in fresh venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import settlegrid; print(settlegrid.SDK_VERSION); from settlegrid import SettleGrid, Wrapper, Invocation, InvalidKeyError"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-python-dist
          path: packages/sdk-python/dist/
